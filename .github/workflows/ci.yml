# Intégration continue Autome (F10.4).
#
# Reproduit la « definition of done » appliquée à chaque feature :
#   - backend  : fmt + clippy (zéro warning) + schéma (migrations + seed)
#                + tests workspace, y compris contre un vrai PostgreSQL et un
#                vrai RabbitMQ (services du job), avec couverture chiffrée et
#                plancher (cargo llvm-cov, #247) + build
#   - frontend : typecheck + lint + tests Vitest avec couverture et plancher
#                (v8, #247)
#   - smoke    : images réelles api + worker sur PostgreSQL et RabbitMQ
#                (Docker Compose), un run de bout en bout (#216)
#
# Couverture : tableau dans le résumé de chaque job, rapports (lcov, JSON)
# en artefacts `coverage-backend` / `coverage-frontend`, aucun service tiers.
#
# Les tests backend sont surtout in-process / in-memory (api : reqwest sur
# serveur local ; worker : queue/stores in-memory) ; ceux qui ciblent les
# `Pg*Store` et `RabbitMqQueue` lisent `TEST_DATABASE_URL` / `TEST_AMQP_URL`,
# fournies par le job backend (services PostgreSQL et RabbitMQ, #218). Le
# frontend tourne sous jsdom. Le smoke couvre le câblage que ces tests ne
# voient pas (variables d'environnement, migrations au démarrage, Dockerfiles,
# healthchecks, sélecteurs de backend).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les exécutions obsolètes sur une même réf (push successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    # Mêmes images que docker-compose.yml et k8s/, pinnées par digest comme
    # les Dockerfiles (#263) : tag lisible avant `@`, rafraîchir avec
    #   docker buildx imagetools inspect <tag>
    # Le job ne démarre ses étapes qu'une fois les healthchecks verts.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        # En TCP : le serveur temporaire de l'entrypoint (initdb) n'écoute
        # que sur le socket Unix, `pg_isready` ne peut donc pas le confondre
        # avec le serveur définitif.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
        ports:
          - 5672:5672
        # Listeners AMQP eux-mêmes (`ping` répond avant que le port accepte
        # les connexions), comme dans docker-compose.yml.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      # Lues par les tests réels (persistence, worker, api). Fournies mais
      # service injoignable ⇒ ces tests échouent (pas de saut).
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/%2f
      # Test réseau de `ReqwestHttpClient` (connectors, #263) : politique
      # stricte, vrai DNS, TLS rustls et certificats racine. Il refuse les
      # adresses non publiques, d'où une cible HTTPS publique plutôt qu'un
      # service du job ; github.com est joignable depuis tout runner.
      TEST_HTTP_URL: https://github.com/robots.txt
    steps:
      - uses: actions/checkout@v4

      # Toolchain ≥ 1.85 (edition2024) ; on pin 1.90 comme les Dockerfiles.
      # `llvm-tools-preview` : instrumentation de la couverture (#247).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Binaire précompilé (somme de contrôle vérifiée par l'action), version
      # pinnée : pas de `cargo install` à chaque run.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Toutes les migrations + seed de dev sur un PostgreSQL jetable
      # (conteneur dédié, indépendant du service) et invariants du schéma.
      - name: Schema (migrations + seed)
        run: scripts/check-migrations.sh

      # Tests instrumentés (#247) : `cargo llvm-cov` lance `cargo test` une
      # seule fois (profil de test, `target/llvm-cov-target`) ; les rapports
      # sont produits plus bas à partir des profils collectés (`--no-report`).
      # `--nocapture` : le message de saut des tests réels reste visible, ce
      # qui permet à l'étape suivante de vérifier qu'aucun n'a été sauté.
      # Sans couleur : `CARGO_TERM_COLOR=always` (posé par la toolchain) glisse
      # des codes ANSI dans « Running … » et casserait le grep du garde-fou.
      - name: Tests (coverage)
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo llvm-cov --no-report --workspace --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      # Garde-fou : un test réel qui passe sans avoir rien exécuté (variable
      # renommée, retirée de `env:`…) ferait passer la CI au vert à tort.
      - name: Real-service tests were not skipped
        run: |
          if grep -E 'absent → test (PostgreSQL|RabbitMQ|réseau) sauté' "$RUNNER_TEMP/cargo-test.log"; then
            echo "::error::Tests PostgreSQL/RabbitMQ/réseau sautés malgré l'environnement du job"
            exit 1
          fi
          echo "Binaires de tests réels exécutés :"
          grep -E 'Running .*(pg_[a-z_]+|rabbitmq)\.rs' "$RUNNER_TEMP/cargo-test.log"

      # Chiffres dans le résumé du job, rapports en artefact — y compris quand
      # le plancher ci-dessous échoue, pour voir ce qui a baissé.
      - name: Coverage report
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/coverage/lcov.info"
          cargo llvm-cov report --json --summary-only --output-path "$RUNNER_TEMP/coverage/coverage.json"
          scripts/coverage-summary.sh rust "$RUNNER_TEMP/coverage/coverage.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: ${{ runner.temp }}/coverage/
          retention-days: 14

      # Plancher bloquant, juste sous la mesure du 2026-10-20 (lignes
      # 95,0 %, fonctions 88,8 %) : à remonter avec elle, jamais à baisser
      # pour faire passer une PR.
      - name: Coverage threshold
        run: cargo llvm-cov report --fail-under-lines 94 --fail-under-functions 87

      - name: Build (release)
        run: cargo build --workspace --release --locked

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm via Corepack (version pinnée par `packageManager` dans
      # package.json) — pas d'action tierce.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      # `--frozen-lockfile` = équivalent de `npm ci` : échoue si
      # `pnpm-lock.yaml` n'est pas en phase → installs déterministes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Couverture v8 (#247) ; planchers dans `vite.config.ts` (`thresholds`),
      # l'étape échoue s'ils ne sont pas atteints.
      - name: Tests (coverage)
        run: pnpm run test:coverage

      # Même quand le plancher échoue, pour voir ce qui a baissé.
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: ../scripts/coverage-summary.sh vitest coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14

  smoke:
    name: Smoke e2e (Docker Compose)
    runs-on: ubuntu-latest
    # Un build Rust release pour les deux binaires (#263) ; à froid,
    # dépendances comprises, c'était ≈ 25 min sur 4 cœurs pour deux builds
    # en parallèle. Quand seul le code du workspace change, la couche
    # cargo-chef vient du cache (#219) ; un commit hors du contexte de build
    # (doc, frontend, k8s) ne recompile rien. + démarrage de la pile (≈ 45 s).
    # Borné pour ne pas occuper un runner sur un conteneur bloqué.
    timeout-minutes: 45
    env:
      # Surcharge CI : nomme les images construites par bake (docker/compose.ci.yml).
      COMPOSE_FILE: docker-compose.yml:docker/compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Même Dockerfile que la CD, lu depuis le compose : les deux cibles
      # partagent l'étage builder, construit une fois par bake (#263). Cache
      # par couches dans un seul scope `backend` partagé avec la CD
      # (`mode=max` pour garder les étages intermédiaires) : dépendances
      # compilées (cargo-chef, #219) réutilisées tant que Cargo.toml /
      # Cargo.lock ne changent pas. Seul `api` l'écrit : deux exports dans le
      # même scope s'écraseraient, et l'export d'`api` contient déjà tout
      # sauf la dernière couche du worker (copie du binaire).
      - name: Build images (api, worker)
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yml
            docker/compose.ci.yml
          targets: api,worker
          load: true
          set: |
            *.cache-from=type=gha,scope=backend
            api.cache-to=type=gha,mode=max,scope=backend

      # db + queue (+ jaeger, #249) démarrés comme dépendances ; `--wait`
      # attend les healthchecks (api : `/readyz` = migrations appliquées, base
      # et broker joignables).
      - name: Start stack
        run: docker compose up --no-build --wait --wait-timeout 180 api worker

      # Un run déclenché via l'API doit être exécuté par le worker (`succeeded`)
      # et former dans Jaeger une trace complète API → worker (#249).
      - name: Smoke
        env:
          SMOKE_REQUIRE_TRACES: "1"
        run: scripts/compose-smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
