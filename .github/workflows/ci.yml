# Intégration continue Autome (F10.4).
#
# Reproduit la « definition of done » appliquée à chaque feature :
#   - backend  : fmt + clippy (zéro warning) + tests workspace + build
#   - frontend : typecheck + lint + tests Vitest
#   - smoke    : images réelles api + worker sur PostgreSQL et RabbitMQ
#                (Docker Compose), un run de bout en bout (#216)
#
# Les tests backend sont in-process / in-memory (api : reqwest sur serveur
# local ; worker : queue/stores in-memory) et le frontend tourne sous jsdom.
# Seul le smoke démarre des services : il couvre le câblage que ces tests ne
# voient pas (variables d'environnement, migrations au démarrage, Dockerfiles,
# healthchecks, sélecteurs de backend).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les exécutions obsolètes sur une même réf (push successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain ≥ 1.85 (edition2024) ; on pin 1.90 comme les Dockerfiles.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build (release)
        run: cargo build --workspace --release --locked

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm via Corepack (version pinnée par `packageManager` dans
      # package.json) — pas d'action tierce.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      # `--frozen-lockfile` = équivalent de `npm ci` : échoue si
      # `pnpm-lock.yaml` n'est pas en phase → installs déterministes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test

  smoke:
    name: Smoke e2e (Docker Compose)
    runs-on: ubuntu-latest
    # Deux builds Rust release en parallèle : ≈ 25 min sur 4 cœurs à froid
    # (dépendances comprises), ≈ 6 min mesurées en local quand seul le code
    # du workspace change (couche cargo-chef en cache, #219) ; + démarrage
    # de la pile (≈ 45 s).
    # Borné pour ne pas occuper un runner sur un conteneur bloqué.
    timeout-minutes: 45
    env:
      # Surcharge CI : nomme les images construites par bake (docker/compose.ci.yml).
      COMPOSE_FILE: docker-compose.yml:docker/compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mêmes Dockerfiles que la CD, lus depuis le compose. Cache par couches
      # partagé avec la CD (scopes `api` / `worker`, `mode=max` pour garder les
      # étages intermédiaires) : dépendances compilées (cargo-chef, #219)
      # réutilisées tant que Cargo.toml / Cargo.lock ne changent pas.
      - name: Build images (api, worker)
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yml
            docker/compose.ci.yml
          targets: api,worker
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker

      # db + queue démarrés comme dépendances ; `--wait` attend les healthchecks
      # (api : `/readyz` = migrations appliquées, base et broker joignables).
      - name: Start stack
        run: docker compose up --no-build --wait --wait-timeout 180 api worker

      # Un run déclenché via l'API doit être exécuté par le worker (`succeeded`).
      - name: Smoke
        run: scripts/compose-smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
