# Intégration continue Autome (F10.4).
#
# Reproduit la « definition of done » appliquée à chaque feature :
#   - backend  : fmt + clippy (zéro warning) + schéma (migrations + seed)
#                + tests workspace, y compris contre un vrai PostgreSQL et un
#                vrai RabbitMQ (services du job) + build
#   - frontend : typecheck + lint + tests Vitest
#   - smoke    : images réelles api + worker sur PostgreSQL et RabbitMQ
#                (Docker Compose), un run de bout en bout (#216)
#
# Les tests backend sont surtout in-process / in-memory (api : reqwest sur
# serveur local ; worker : queue/stores in-memory) ; ceux qui ciblent les
# `Pg*Store` et `RabbitMqQueue` lisent `TEST_DATABASE_URL` / `TEST_AMQP_URL`,
# fournies par le job backend (services PostgreSQL et RabbitMQ, #218). Le
# frontend tourne sous jsdom. Le smoke couvre le câblage que ces tests ne
# voient pas (variables d'environnement, migrations au démarrage, Dockerfiles,
# healthchecks, sélecteurs de backend).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les exécutions obsolètes sur une même réf (push successifs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    # Mêmes versions que docker-compose.yml et k8s/. Le job ne démarre ses
    # étapes qu'une fois les healthchecks verts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        # En TCP : le serveur temporaire de l'entrypoint (initdb) n'écoute
        # que sur le socket Unix, `pg_isready` ne peut donc pas le confondre
        # avec le serveur définitif.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        # Listeners AMQP eux-mêmes (`ping` répond avant que le port accepte
        # les connexions), comme dans docker-compose.yml.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      # Lues par les tests réels (persistence, worker, api). Fournies mais
      # service injoignable ⇒ ces tests échouent (pas de saut).
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/%2f
    steps:
      - uses: actions/checkout@v4

      # Toolchain ≥ 1.85 (edition2024) ; on pin 1.90 comme les Dockerfiles.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Toutes les migrations + seed de dev sur un PostgreSQL jetable
      # (conteneur dédié, indépendant du service) et invariants du schéma.
      - name: Schema (migrations + seed)
        run: scripts/check-migrations.sh

      # `--nocapture` : le message de saut des tests réels reste visible, ce
      # qui permet à l'étape suivante de vérifier qu'aucun n'a été sauté.
      # Sans couleur : `CARGO_TERM_COLOR=always` (posé par la toolchain) glisse
      # des codes ANSI dans « Running … » et casserait le grep du garde-fou.
      - name: Tests
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"

      # Garde-fou : un test réel qui passe sans avoir rien exécuté (variable
      # renommée, retirée de `env:`…) ferait passer la CI au vert à tort.
      - name: Real-service tests were not skipped
        run: |
          if grep -E 'absent → test (PostgreSQL|RabbitMQ) sauté' "$RUNNER_TEMP/cargo-test.log"; then
            echo "::error::Tests PostgreSQL/RabbitMQ sautés malgré les services du job"
            exit 1
          fi
          echo "Binaires de tests réels exécutés :"
          grep -E 'Running .*(pg_[a-z_]+|rabbitmq)\.rs' "$RUNNER_TEMP/cargo-test.log"

      - name: Build (release)
        run: cargo build --workspace --release --locked

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # pnpm via Corepack (version pinnée par `packageManager` dans
      # package.json) — pas d'action tierce.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      # `--frozen-lockfile` = équivalent de `npm ci` : échoue si
      # `pnpm-lock.yaml` n'est pas en phase → installs déterministes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test

  smoke:
    name: Smoke e2e (Docker Compose)
    runs-on: ubuntu-latest
    # Deux builds Rust release en parallèle (≈ 25 min mesurées sur 4 cœurs,
    # compilation complète) + démarrage de la pile (≈ 45 s) : borné pour ne
    # pas occuper un runner sur un conteneur bloqué.
    timeout-minutes: 45
    env:
      # Surcharge CI : nomme les images construites par bake (docker/compose.ci.yml).
      COMPOSE_FILE: docker-compose.yml:docker/compose.ci.yml
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mêmes Dockerfiles que la CD, lus depuis le compose. Cache par couches
      # partagé avec la CD (scopes `api` / `worker`) : base et runtime réutilisés,
      # la compilation est refaite dès que les sources changent (`COPY . .`).
      - name: Build images (api, worker)
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yml
            docker/compose.ci.yml
          targets: api,worker
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,mode=max,scope=api
            worker.cache-from=type=gha,scope=worker
            worker.cache-to=type=gha,mode=max,scope=worker

      # db + queue démarrés comme dépendances ; `--wait` attend les healthchecks
      # (api : `/readyz` = migrations appliquées, base et broker joignables).
      - name: Start stack
        run: docker compose up --no-build --wait --wait-timeout 180 api worker

      # Un run déclenché via l'API doit être exécuté par le worker (`succeeded`).
      - name: Smoke
        run: scripts/compose-smoke.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
