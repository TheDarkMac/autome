# Livraison continue Autome (F10.5).
#
# Complète la CI (F10.4) : une fois le code intégré sur `main` (ou un tag de
# version poussé), on construit et publie les trois images de conteneurs sur
# GHCR, puis on prépare le déploiement Kubernetes à partir des manifests
# `k8s/` (F10.3).
#
#   build-push : matrice api / worker / frontend → ghcr.io/<owner>/autome-*
#   deploy     : rend les manifests avec les images taggées et applique le
#                déploiement *si* un kubeconfig est fourni (sinon dry-run) :
#                l'overlay du cluster (variable de dépôt K8S_OVERLAY, ex.
#                `clusters/prod`) ou, sans elle, la base `k8s/` ; l'API
#                d'abord (elle migre la base), le worker ensuite (#271).
#
# La CD ne s'exécute qu'après une CI verte : déclenchée par `workflow_run`
# (CI terminée avec succès sur `main`) et par les tags `v*.*.*` (release).
# Elle livre le commit que la CI a validé, pas le dernier de `main` : le job
# `release` le fixe une fois pour les deux autres (#278).
name: CD

on:
  # Release : un tag de version déclenche build + déploiement.
  push:
    tags: ["v*.*.*"]
  # Staging : on attend la fin (réussie) de la CI sur `main`.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Relance manuelle depuis l'onglet Actions.
  workflow_dispatch:

# Une seule livraison à la fois par réf (évite les push d'images concurrents).
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────── Commit ────────────────────────────
  # Commit à livrer, calculé une seule fois (#278). Sur `workflow_run`,
  # `github.sha` est le dernier commit de `main` au démarrage de la CD, pas
  # celui que la CI a validé : deux fusions rapprochées livreraient un commit
  # dont la CI n'est pas finie, et `deploy`, qui checkoute plus tard, pourrait
  # épingler un tag jamais poussé. D'où `workflow_run.head_sha` ; `github.sha`
  # (commit de la réf) pour un tag ou une relance manuelle.
  #
  # Sur `workflow_run`, seulement une CI verte lancée par un push sur ce
  # dépôt : `branches: [main]` filtre le *nom* de la branche de tête, et une PR
  # ouverte depuis la branche `main` d'un fork déclenche aussi la CD.
  # Checkouter son `head_sha` construirait le code du fork avec
  # `packages: write` puis le déploierait avec KUBE_CONFIG. Job sauté ⇒
  # `build-push` et `deploy` sautés.
  release:
    name: Resolve commit
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
      owner: ${{ steps.commit.outputs.owner }}
    steps:
      # Tag immuable `sha-<7>` (même longueur que l'ancien `type=sha`) ; owner
      # en minuscules : GHCR exige un namespace minuscule, alors que
      # `github.repository_owner` conserve la casse d'origine (TheDarkMac) —
      # comme les références dans k8s/*.yaml.
      - name: Compute commit, tag and owner
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "sha=$SHA"
            echo "tag=sha-${SHA::7}"
            echo "owner=${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Commit livré : \`$SHA\` (image \`sha-${SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────── Build & push ──────────────────────────
  build-push:
    name: Build & push (${{ matrix.image }})
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # api & worker : contexte = racine du dépôt, une cible chacun du
          # Dockerfile backend. Même scope de cache que la CI (#263) : son
          # smoke a déjà construit le builder pour ce commit. Seul `api`
          # écrit le scope (deux exports parallèles s'écraseraient).
          - image: api
            context: .
            dockerfile: docker/backend.Dockerfile
            target: api
            scope: backend
            write-cache: true
          - image: worker
            context: .
            dockerfile: docker/backend.Dockerfile
            target: worker
            scope: backend
            write-cache: false
          # frontend : contexte = frontend/, build Vite statique.
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            scope: frontend
            write-cache: true
    steps:
      # Le commit résolu par `release`, pas `github.sha` (#278).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR : authentification avec le jeton de l'exécution (packages: write).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags & labels : latest (sur main), sha-<court>, vX.Y.Z (sur tag).
      # `type=sha` et le label `revision` lisent `github.sha` : le tag et le
      # label viennent donc de `release` (#278).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/autome-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' }}
            type=raw,value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: ${{ matrix.write-cache && format('type=gha,mode=max,scope={0}', matrix.scope) || '' }}

  # ──────────────────────────── Deploy ────────────────────────────
  # Rend les manifests avec l'image taggée (sha-<court>), puis applique sur le
  # cluster *si* le secret KUBE_CONFIG est présent ; sinon, dry-run client qui
  # valide le rendu sans cluster (DoD : `kustomize build` sans erreur).
  deploy:
    name: Deploy (Kubernetes)
    needs: [release, build-push]
    runs-on: ubuntu-latest
    # Environnement protégé : permet d'exiger une approbation manuelle et de
    # porter les secrets de déploiement (KUBE_CONFIG) côté GitHub.
    environment: production
    permissions:
      contents: read
    # Le secret est exposé via env : le contexte `secrets` n'est pas
    # utilisable dans les conditions `if:` des étapes, contrairement à `env`.
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      # Overlay du cluster (proxys de confiance, NetworkPolicy…, #271) ;
      # vide = la base k8s/. Il inclut k8s/ : l'épinglage ci-dessous s'y applique.
      K8S_DIR: ${{ vars.K8S_OVERLAY || 'k8s' }}
    steps:
      # Manifests du commit livré : même commit que les images (#278).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      # kubectl embarque `kubectl kustomize` (rendu des manifests k8s/).
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Surcharge les images des manifests par la version que `build-push`
      # vient de pousser : tag repris de `release`, pas recalculé (#278).
      - name: Pin images in manifests
        working-directory: k8s
        env:
          owner: ${{ needs.release.outputs.owner }}
          tag: ${{ needs.release.outputs.tag }}
        run: |
          for svc in api worker frontend; do
            sed -i "s|ghcr.io/${owner}/autome-${svc}:latest|ghcr.io/${owner}/autome-${svc}:${tag}|g" "${svc}.yaml"
          done

      # Toujours valider le rendu (DoD), même sans cluster.
      - name: Render manifests
        run: kubectl kustomize "$K8S_DIR" | tee /tmp/rendered.yaml

      # Déploiement réel uniquement si un kubeconfig est fourni en secret.
      # En deux temps (#271) : le worker ne migre pas, il exécuterait sinon
      # ses runs sur un schéma que l'API n'a pas encore migré. 1) tout sauf
      # le worker (ressources sans label `name` comprises), et l'API prête —
      # donc migrée (AUTOME_MIGRATE) ; 2) le worker. Il attend de toute façon
      # le schéma au démarrage, ce qui couvre un `kubectl apply` manuel.
      - name: Deploy to cluster
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          kubectl apply -f /tmp/rendered.yaml -l 'app.kubernetes.io/name!=worker'
          kubectl -n autome rollout status deployment/api --timeout=300s
          kubectl apply -f /tmp/rendered.yaml -l 'app.kubernetes.io/name=worker'
          kubectl -n autome rollout status deployment/worker --timeout=300s
          kubectl -n autome rollout status deployment/frontend --timeout=120s

      - name: Deploy skipped (no kubeconfig)
        if: ${{ env.KUBE_CONFIG == '' }}
        run: |
          echo "::notice::KUBE_CONFIG absent — déploiement réel ignoré." \
               "Manifests rendus et validés (dry-run). Voir /tmp/rendered.yaml."
