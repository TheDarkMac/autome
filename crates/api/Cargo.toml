[package]
name = "autome-api"
description = "Serveur HTTP du backend Autome (axum) — F1.3.d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "autome-api"
path = "src/main.rs"

[dependencies]
autome-core = { workspace = true }
autome-connectors = { workspace = true }
autome-engine = { workspace = true }
autome-persistence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# axum confiné au crate `api` (décision ADR 0001 / F1.2).
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# TLS (F6.4)
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Spec OpenAPI (F7.4)
utoipa = { workspace = true }
# Logs structurés (#176)
tracing = { workspace = true }
# Anti-bruteforce par IP (#190) : clé HMAC de l'adresse, proxys de confiance
hmac = { workspace = true }
sha2 = { workspace = true }
ipnet = { workspace = true }
# URL secrètes des webhooks (#202) : sel aléatoire
rand = { workspace = true }
# Mot de passe oublié (#204) : envoi SMTP (rustls, pas d'OpenSSL système),
# trait d'envoi asynchrone
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
async-trait = { workspace = true }
# CORS pour le frontend servi sur une autre origine (#225)
tower-http = { version = "0.6", features = ["cors"] }
# Second facteur et mots de passe compromis (#245) : TOTP RFC 6238
# (HMAC-SHA-1), préfixe SHA-1 du k-anonymat Have I Been Pwned, QR code SVG
# de l'enrôlement (sans dépendance d'image), client HTTP async du corpus.
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { workspace = true }
# Encodage hexadécimal (MAC, empreintes, identifiants) (#253)
hex = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Tests HTTPS round-trip (F6.4)
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
# Exporteur en mémoire des tests de traces (#249).
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
