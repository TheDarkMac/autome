[package]
name = "autome-core"
description = "Types, erreurs et traits partagés du backend Autome (F1.3.b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Traits de stockage asynchrones (dette #107) — `async fn` en trait objet.
async-trait = { workspace = true }
# block_on minimal pour ponter le scheduler thread-based vers Queue async (#107).
pollster = { workspace = true }
# Auth (F6.1)
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand = { workspace = true }
# Encodage hexadécimal des identifiants aléatoires (#253)
hex = { workspace = true }
# Chiffrement secrets (F6.3)
aes-gcm = { workspace = true }
base64 = { workspace = true }
# Logs structurés (#176)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
reqwest = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
# Exécuteur pour les tests des stores asynchrones.
tokio = { workspace = true, features = ["macros", "rt"] }
# Exporteur en mémoire des tests de traces (#249).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
