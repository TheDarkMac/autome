[package]
name = "autome-persistence"
description = "Backends de persistance PostgreSQL des traits de stockage (dette #107)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
autome-core = { workspace = true }
# Trait `ConnectorTokenStore` + format d'enveloppe des tokens OAuth (backlog
# post-audit : tokens de connecteurs par propriétaire).
autome-connectors = { workspace = true }
# Dérivation de la clé des credentials depuis `ENCRYPTION_KEY` (SHA-256).
sha2 = { workspace = true }
# Pont sync → async du store de tokens (`block_in_place` + `Handle::block_on`).
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# Driver PostgreSQL **async** (tokio-postgres) + pool deadpool : compatibles
# avec le runtime tokio de l'API (les traits stores de `core` sont async).
# `with-serde_json-1` : mapping `serde_json::Value` ↔ colonne `jsonb`.
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
# Broker RabbitMQ async (dette #107).
lapin = { workspace = true }
tokio-executor-trait = { workspace = true }
tokio-reactor-trait = { workspace = true }

[dev-dependencies]
# Exécuteur des tests d'intégration asynchrones. `net`/`time` requis par le
# réacteur tokio de lapin (I/O AMQP).
# `sync` : `OnceCell` (schéma de test appliqué une fois par binaire).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
