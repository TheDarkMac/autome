[package]
name = "autome-persistence"
description = "Backends de persistance PostgreSQL des traits de stockage (dette #107)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
autome-core = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# Driver PostgreSQL **async** (tokio-postgres) + pool deadpool : compatibles
# avec le runtime tokio de l'API (les traits stores de `core` sont async).
# `with-serde_json-1` : mapping `serde_json::Value` ↔ colonne `jsonb`.
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }

[dev-dependencies]
# Exécuteur des tests d'intégration asynchrones.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
