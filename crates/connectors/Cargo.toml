[package]
name = "autome-connectors"
description = "Intégrations tierces (Slack, Gmail, Notion, GitHub, HTTP) — F1.3.e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
autome-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# OAuth2 PKCE + state aléatoires (F6.2)
rand = { workspace = true }
base64 = { workspace = true }
# Transport HTTP réel (dette #107) — client bloquant rustls.
reqwest = { workspace = true }
# Résolution DNS async du résolveur anti-SSRF (exécuté dans le runtime interne
# de reqwest) — backlog post-audit.
tokio = { workspace = true, features = ["net"] }
# Span `http_client` des appels sortants, exporté en trace (#249).
tracing = { workspace = true }
