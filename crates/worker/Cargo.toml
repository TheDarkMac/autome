[package]
name = "autome-worker"
description = "Exécuteur de runs (consumer de la file → moteur) — F1.3.f"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "autome-worker"
path = "src/main.rs"

[dependencies]
autome-core = { workspace = true }
autome-engine = { workspace = true }
autome-connectors = { workspace = true }
autome-persistence = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# Logs structurés (#176)
tracing = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
