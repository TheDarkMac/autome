[package]
name = "autome-worker"
description = "Exécuteur de runs (consumer de la file → moteur) — F1.3.f"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "autome-worker"
path = "src/main.rs"

[dependencies]
autome-core = { workspace = true }
autome-engine = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
# Pont synchrone → stores asynchrones dans le test e2e (dette #107). Le worker
# de production reste thread-based (sync) ; sa bascule async viendra avec lapin.
tokio = { workspace = true, features = ["rt-multi-thread"] }
