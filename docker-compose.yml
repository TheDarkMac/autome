# Stack de développement Autome (F10.2).
#
# Démarre toute la plateforme en une commande :
#   docker compose up --build
#
# Services :
#   - db       : PostgreSQL (schéma migrations/ — F1.5)
#   - queue    : RabbitMQ + UI de management (http://localhost:15672, guest/guest)
#   - api      : backend HTTP (http://localhost:8080)
#   - worker   : exécuteur de runs (stateless)
#   - frontend : SPA servie par nginx (http://localhost:8081)
#   - prometheus : scrape /metrics de l'api et du worker (http://localhost:9090) — F10.6, #235
#   - grafana    : dashboards provisionnés (http://localhost:3000, admin/admin)
#   - jaeger     : traces OpenTelemetry de l'api et du worker (http://localhost:16686) — #249
#
# Les hôtes inter-services sont les NOMS de services Docker (`db`, `queue`).
# L'API et le worker partagent PostgreSQL (stores : workflows, runs, comptes,
# tokens de connecteurs) et RabbitMQ (file des runs) — sans quoi chacun
# tournerait en mémoire et les runs déclenchés via l'API ne seraient jamais
# exécutés (#178). L'API applique les migrations au démarrage.
# Vérification de bout en bout : scripts/compose-smoke.sh.
# Profil `dev` (secrets de dev tolérés) — ne PAS utiliser tel quel en production.

# Images tierces de la pile pinnées par digest (#263), comme les services du
# job `backend` de la CI et k8s/ : tag lisible avant `@`, rafraîchir avec
#   docker buildx imagetools inspect <tag>
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autome"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI de management
    healthcheck:
      # `ping` répond dès que le nœud tourne, avant que le port AMQP accepte
      # les connexions : on vérifie les listeners eux-mêmes (#178).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_PROFILE: dev
      APP_HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/autome
      # Vhost par défaut `/` = `%2f` (une barre finale seule = vhost vide).
      QUEUE_URL: amqp://guest:guest@queue:5672/%2f
      AUTOME_PERSISTENCE: postgres
      AUTOME_QUEUE: rabbitmq
      AUTOME_MIGRATE: "true"
      JWT_SECRET: dev-insecure-jwt-secret
      ENCRYPTION_KEY: dev-insecure-encryption-key
      # Le frontend (:8081) et Vite (:5173) appellent l'API depuis une autre
      # origine : sans CORS, le navigateur bloque tout (#225).
      AUTOME_CORS_ORIGINS: http://localhost:8081,http://localhost:5173
      # Traces OTLP/HTTP vers Jaeger (#249) ; retirer la variable coupe l'export.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8080:8080"
    # Arrêt gracieux (#194) : retrait (5 s) + drain (≤ 20 s) avant SIGKILL.
    stop_grace_period: 35s
    # Prête = migrations appliquées, base et broker joignables (#192). L'image
    # n'a ni curl ni wget : requête HTTP brute via bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
      # Démarré, sans plus : l'API tourne même si le collecteur est absent.
      jaeger:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      APP_PROFILE: dev
      DATABASE_URL: postgres://postgres:postgres@db:5432/autome
      QUEUE_URL: amqp://guest:guest@queue:5672/%2f
      AUTOME_PERSISTENCE: postgres
      AUTOME_QUEUE: rabbitmq
      # Même clé que l'API : le worker déchiffre les tokens OAuth des connecteurs.
      ENCRYPTION_KEY: dev-insecure-encryption-key
      # Traces OTLP/HTTP vers Jaeger (#249) : le run prolonge la trace de la
      # requête qui l'a déclenché.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Arrêt borné (#200) : 25 s pour finir les runs en cours, puis clôture.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9091 && printf 'GET /livez HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
      # L'API applique les migrations au démarrage : on attend qu'elle soit
      # prête, pas seulement lancée (#192).
      api:
        condition: service_healthy
      jaeger:
        condition: service_started

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # URL atteinte par le NAVIGATEUR (port publié de l'api), inlinée au build.
        VITE_API_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - api

  # ─────────────────────────── Monitoring (F10.6) ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # Identifiants dev (à changer en prod) + accès anonyme désactivé.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Provisioning (datasource + provider de dashboards) et dashboards JSON.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Traces (#249) : Jaeger tout-en-un, stockage en mémoire (perdu au
  # redémarrage). Reçoit l'OTLP/HTTP de l'api et du worker sur 4318 (publié
  # pour un binaire lancé hors compose), UI et API de recherche sur 16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP/HTTP

volumes:
  pgdata:
  promdata:
  grafanadata:
