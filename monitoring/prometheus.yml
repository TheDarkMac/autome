# Configuration Prometheus — monitoring Autome (F10.6.b).
#
# Scrape l'endpoint /metrics de l'API (registre F10.6.a) et du worker (#235).
# En dev (compose), les cibles sont les noms de services Docker (`api:8080`,
# `worker`) ; en k8s, un ConfigMap identique cible les Services `api` et
# `worker` (cf. k8s/monitoring.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus s'auto-scrape (santé de l'instance).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend Autome : métriques HTTP (requêtes, latence, in-flight).
  - job_name: autome-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: api

  # Worker(s) : livraisons, runs et leur durée, déclencheurs (#235). Servi par
  # le serveur de sondes (port 9091). Découverte DNS : le nom `worker` résout
  # vers chaque réplique (DNS de Docker ; Service headless `worker` en k8s),
  # une cible par instance plutôt qu'une réplique au hasard.
  - job_name: autome-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: worker
