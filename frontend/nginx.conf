# Config nginx du frontend Autome (F10.1) — SPA React buildée par Vite.
#
# Sert les assets statiques depuis /usr/share/nginx/html et renvoie
# index.html pour toute route inconnue (`try_files … /index.html`) afin
# que le routing client-side fonctionne sur rechargement / accès direct.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Assets hashés par Vite (immuables) : cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback SPA : toute autre route sert index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
