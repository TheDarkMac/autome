# Frontend (SPA nginx) `autome-frontend` (F10.3).
# NB : sécurité allégée vs api/worker — l'image `nginx:alpine` a besoin
# d'écrire ses caches (`/var/cache/nginx`) et tourne en root pour binder :80.
# Un durcissement (image nginx-unprivileged + runAsNonRoot) est une
# amélioration possible mais hors périmètre F10.3.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autome
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: autome
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autome
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: autome
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: autome
    spec:
      containers:
        - name: frontend
          image: ghcr.io/thedarkmac/autome-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
