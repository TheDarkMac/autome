# Exécuteur de runs `autome-worker` (F10.3) : consommateur long-vivant de la
# file `runs` (RabbitMQ), état des runs en PostgreSQL. Pas de Service : seules
# ses sondes écoutent (port 9091, #192).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autome
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: autome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: autome
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/thedarkmac/autome-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: probes
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: autome-config
            - secretRef:
                name: autome-secrets
          # Sondes (#192). Démarrage : attente du broker (jusqu'à 60 s).
          startupProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 3
            failureThreshold: 30
          # Vivant = chaque consommateur tourne, ou traite un run depuis moins
          # que AUTOME_RUN_TIMEOUT_SECS (+ 1 min) : un run long ne fait pas
          # redémarrer le pod ; un consommateur figé, si.
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Prêt = PostgreSQL et RabbitMQ joignables (déploiement progressif).
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
