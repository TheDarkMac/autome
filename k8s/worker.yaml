# Exécuteur de runs `autome-worker` (F10.3) : consommateur long-vivant de la
# file `runs` (RabbitMQ), état des runs en PostgreSQL. Seul son serveur de
# sondes écoute (port 9091) : `/livez`, `/readyz` (#192) et `/metrics` (#235).
#
# Service **headless** `worker` : pas d'IP virtuelle ni de répartition, le nom
# DNS résout vers chaque pod prêt ; Prometheus (dns_sd_configs, cf.
# monitoring.yaml) scrape ainsi chaque réplique. `/metrics` n'a pas
# d'authentification (aucun identifiant dans les séries) : ne pas exposer ce
# port hors du cluster.
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: autome
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: autome
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: probes
      port: 9091
      targetPort: probes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: autome
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: autome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: autome
    spec:
      # Arrêt borné (#200, #239) : SIGTERM ⇒ plus de nouveaux runs, chaque
      # run en cours s'arrête au prochain nœud et est remis en file ; au plus
      # AUTOME_WORKER_SHUTDOWN_TIMEOUT_SECS (25 s) pour un nœud long, puis
      # remise en file en plein nœud. Pour des nœuds longs, augmenter les deux
      # ensemble (grâce > délai d'arrêt + ~10 s).
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/thedarkmac/autome-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: probes
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: autome-config
            - secretRef:
                name: autome-secrets
          # Sondes (#192). Démarrage : attente du broker (jusqu'à 60 s).
          startupProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 3
            failureThreshold: 30
          # Vivant = chaque consommateur tourne, ou traite un run depuis moins
          # que AUTOME_RUN_TIMEOUT_SECS (+ 1 min) : un run long ne fait pas
          # redémarrer le pod ; un consommateur figé, si.
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Prêt = PostgreSQL et RabbitMQ joignables (déploiement progressif).
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
