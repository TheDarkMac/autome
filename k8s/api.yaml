# Backend HTTP `autome-api` (F10.3).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: autome
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: autome
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: autome
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: autome
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: autome
    spec:
      # Arrêt gracieux (#194) : SIGTERM ⇒ readiness à 503, 5 s de retrait des
      # endpoints, puis au plus 20 s de drain (AUTOME_SHUTDOWN_DELAY_SECS /
      # AUTOME_SHUTDOWN_TIMEOUT_SECS). La grâce doit dépasser leur somme.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/thedarkmac/autome-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: autome-config
            - secretRef:
                name: autome-secrets
          # Sondes séparées (#192). Démarrage : migrations et attente du broker
          # (jusqu'à AUTOME_QUEUE_CONNECT_TIMEOUT_SECS, 60 s) avant l'écoute —
          # la startup probe laisse ~90 s avant que la liveness ne s'applique.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
            failureThreshold: 30
          # Prêt = PostgreSQL et RabbitMQ joignables (chaque vérification
          # bornée à 2 s, en parallèle). Échec ⇒ retiré du Service, pas tué.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # Vivant = le process répond ; ne dépend d'aucune dépendance (une
          # panne de base ne doit pas redémarrer tous les pods en boucle).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
