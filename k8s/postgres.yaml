# PostgreSQL (F10.3) — StatefulSet pour un stockage stable + Service
# headless pour une identité réseau stable (`postgres.autome.svc`).
# En production : préférer un opérateur (CloudNativePG, Zalando) ou un
# service managé ; ce manifeste suffit pour un cluster de dev/staging.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: autome
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: autome
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: autome
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: autome
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: autome
    spec:
      containers:
        - name: postgres
          # Pinnée par digest (#263), même image que compose et la CI.
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: autome
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autome-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "autome"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "autome"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
