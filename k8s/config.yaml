# Configuration non-sensible (F10.3) — variables d'environnement injectées
# dans l'API et le worker via `envFrom`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: autome-config
  namespace: autome
  labels:
    app.kubernetes.io/part-of: autome
data:
  APP_PROFILE: "prod"
  APP_HTTP_ADDR: "0.0.0.0:8080"
  # Backends durables, obligatoires en `prod` (#172 : l'API et le worker
  # refusent de démarrer en `memory`). PostgreSQL = `DATABASE_URL`, RabbitMQ =
  # `QUEUE_URL` (Secret ci-dessous).
  AUTOME_PERSISTENCE: "postgres"
  AUTOME_QUEUE: "rabbitmq"
  # Migrations appliquées par l'API au démarrage (idempotent, verrou
  # applicatif entre répliques) ; ignoré par le worker.
  AUTOME_MIGRATE: "true"
  # Providers OAuth activés (#161). Les AUTOME_OAUTH_<ID>_* non sensibles
  # (URLs, scopes) peuvent vivre ici ; client_id/client_secret vont au Secret.
  # Vide/absent = OAuth désactivé.
  AUTOME_OAUTH_PROVIDERS: ""
  # Anti-SSRF : hôtes internes autorisés en sortie (vide = destinations
  # publiques uniquement). Ex. "keycloak.autome.svc.cluster.local".
  AUTOME_EGRESS_ALLOWLIST: ""
---
# Secrets (F10.3) — VALEURS DE DÉMONSTRATION, à remplacer impérativement
# avant tout usage réel (SealedSecrets / External Secrets / Vault…).
# `DATABASE_URL` et `QUEUE_URL` contiennent des identifiants → ici plutôt
# que dans le ConfigMap. `JWT_SECRET`/`ENCRYPTION_KEY` sont effectivement lus
# par l'API depuis la config (dette #107 résorbée).
apiVersion: v1
kind: Secret
metadata:
  name: autome-secrets
  namespace: autome
  labels:
    app.kubernetes.io/part-of: autome
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_with_a_real_32B_minimum_jwt_secret"
  ENCRYPTION_KEY: "REPLACE_ME_with_a_real_encryption_key"
  POSTGRES_PASSWORD: "REPLACE_ME_postgres_password"
  DATABASE_URL: "postgres://postgres:REPLACE_ME_postgres_password@postgres:5432/autome"
  QUEUE_URL: "amqp://guest:guest@rabbitmq:5672/"
  # Credentials des providers OAuth (#161) — à renseigner par provider listé
  # dans AUTOME_OAUTH_PROVIDERS. Exemple (décommenter + compléter) :
  #AUTOME_OAUTH_GOOGLE_CLIENT_ID: "REPLACE_ME"
  #AUTOME_OAUTH_GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  #AUTOME_OAUTH_GOOGLE_AUTHORIZE_URL: "https://accounts.google.com/o/oauth2/v2/auth"
  #AUTOME_OAUTH_GOOGLE_TOKEN_URL: "https://oauth2.googleapis.com/token"
  #AUTOME_OAUTH_GOOGLE_REDIRECT_URI: "https://app.autome/oauth/callback/google"
  #AUTOME_OAUTH_GOOGLE_SCOPES: "openid,email,profile"
