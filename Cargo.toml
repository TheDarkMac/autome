# Workspace Cargo — Autome (F1.3.a)
# Graphe de dépendances entre crates : cf. docs/ARCHITECTURE.md §9.
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/connectors",
    "crates/engine",
    "crates/api",
    "crates/worker",
    "crates/persistence",
]

# Métadonnées partagées par tous les crates du workspace.
[workspace.package]
version = "0.1.0"
edition = "2021"
# Plancher réel : l'arbre de dépendances exige la feature Cargo `edition2024`,
# stabilisée en Rust 1.85 (un build sur 1.80–1.84 échoue — cf. F10.1/F10.4).
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/TheDarkMac/autome"
authors = ["Équipe Autome"]

# Résolution centralisée des versions (F1.3.a) : les crates référencent
# `xxx = { workspace = true }` pour garantir une version unique partout.
[workspace.dependencies]
# Crates internes (préfixe `autome-` pour ne pas masquer le `core` de la std)
autome-core = { path = "crates/core" }
autome-engine = { path = "crates/engine" }
autome-connectors = { path = "crates/connectors" }
autome-persistence = { path = "crates/persistence" }
# Dépendances tierces communes
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crypto pour la vérification de signatures webhook (F4.4.d)
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
# Plages CIDR des proxys de confiance (#190) ; déjà tiré par reqwest
ipnet = "2"
# Auth utilisateur (F6.1)
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["alloc", "rand_core"] }
rand = "0.8"
# Chiffrement secrets au repos (F6.3)
aes-gcm = "0.10"
base64 = "0.22"
# Traits de stockage asynchrones (dette #107 — refactor async).
async-trait = "0.1"
tokio = { version = "1" }
# `block_on` minimal (sans runtime) pour ponter la boucle thread-based du
# scheduler vers les traits async — dette #107.
pollster = "0.3"
# Persistance PostgreSQL **async** (dette #107) : driver tokio-postgres + pool
# deadpool, compatibles avec le runtime tokio de l'API.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
# Broker RabbitMQ async (dette #107) : client AMQP `lapin` + adaptateurs tokio
# (exécuteur/réacteur) pour le faire tourner sur le runtime de l'app.
lapin = "2"
tokio-executor-trait = "2"
tokio-reactor-trait = "1"
# `StreamExt::next` sur le consommateur `basic_consume` de lapin (#237).
futures-lite = "2"
# TLS (F6.4) — server HTTPS rustls (provider explicite : ring)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# Spec OpenAPI générée à la compilation (F7.4)
utoipa = { version = "5", features = ["axum_extras"] }
# Transport HTTP de production des connecteurs (dette #107). Client **bloquant**
# (le trait `HttpClient` est sync, exécuté par le worker thread-based) ; TLS via
# rustls pour rester cohérent avec le serveur (pas d'OpenSSL système).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Logs structurés (#176) : façade `tracing` dans les crates, subscriber
# (filtre `RUST_LOG`, sortie JSON ou texte) initialisé par les binaires.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Lints partagés (F1.3.g) : appliqués via `[lints] workspace = true` dans
# chaque crate. `clippy -- -D warnings` en CI (cf. CONVENTIONS §4/§5).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Profil de release : binaires fins, optimisés.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
